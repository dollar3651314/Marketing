# 每个 PR 的自动检查（agents 规则 C54），按"精简 CI"写（C74，模板 agents/模板/ci.yml）。
#   - 每次都跑：索引检查（C53）、类型检查、单元测试、插件侧边栏和网页后台的浏览器级测试（C141）。项目小，不按路径跳过。
#   - 推送到 staging → 部署测试版 marketing-staging；推送到 main → 部署正式版 marketing（2026-10-30 由 quickcome-copilot 改名）。
#   - 同一分支连续推送时取消旧的运行；缓存依赖和浏览器；每个 job 都有 timeout-minutes；不开定时任务。
# 分支保护只把汇总 job "ci-ok" 设为"必须通过"。
# CI 不需要任何密钥：Gemini、Workers AI 用替身，D1 用 Miniflare 的本地 SQLite。只有 deploy job 用 CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID，没填时打印"跳过"。
name: ci
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # 系统固定 ubuntu-24.04：2026-10-30 ubuntu-latest 换成 26.04 后，Playwright 1.56.1 装不了浏览器依赖（"does not support chromium on ubuntu26.04"）
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 项目地图和项目索引（C53）
        run: node scripts/check-project-index.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: 单元测试（中转服务、程序检查、读取适配器）
        run: npm test
      - name: 浏览器缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: 插件侧边栏（替身 chrome API；设置、存满就停、暂停和继续、切分页；agents C141）
        run: node scripts/e2e-ext.mjs
      - name: 网页后台（本地 wrangler dev + 本地 D1：公司页各块、变灰、解析失败、"我做了"、旧三页照常；agents C141）
        run: npm run e2e:admin
      - name: 跟帖评论清单基线（一键回复、我回了、跳过、删除、筛选、"今天"计数；公司平台 PR 1 起每个 PR 都要全绿，风险 R-1）
        run: npm run e2e:queue
      - name: 公司平台批 1 验收（三层导航、工作台、待办按截止排和红橙、打勾跨设备、填数字、forecast 项目页、375 / 1440 宽、深浅色）
        run: npm run e2e:platform
      - name: 公司平台批 2 验收（菜单待办数刷新后马上显示、每天回帖上限按项目、按项目看用量；375 / 1440 宽）
        run: npm run e2e:tools
        env:
          E2E_ARTIFACTS: e2e-artifacts
      - name: 批 2 验收失败时留证据（不通过的几行 + 截图）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-tools-failure
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: 公司平台批 3 验收（团队在做什么：开工、上一步、未标、变灰、最近结束、CI 红提醒、外部、签名不对、有延迟、Webhook 开关；375 / 1440 宽）
        run: npm run e2e:live
      - name: 公共工具「基金观察」（入口、刷新按 cursor 循环、四个时间段、市场切换、散点、逐只对比、单日 ±3%、展开详情、涨绿跌红、400 宽、明暗对比度、空状态）
        run: npm run e2e:funds
      - name: 网页 App（PWA）第一版（manifest 和图标、SW 注册、SW 不缓存 /api、离线提示页、standalone 顶栏「刷新」、密码框 autocomplete）
        run: npm run e2e:pwa

  # 汇总：分支保护只把这一项设为"必须通过"
  ci-ok:
    needs: [check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: 汇总结果
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "有检查失败或被取消"; exit 1
          fi

  # 部署：只在推送到 staging（测试版）、main（正式版），并且 ci-ok 通过时。
  # 没填 GitHub Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 时 deploy.sh 打印"跳过"并成功（C103）。
  deploy:
    needs: [ci-ok]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main') && needs.ci-ok.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 部署（staging → marketing-staging；main → marketing）
        env:
          TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
        run: bash scripts/deploy.sh "$TARGET"
