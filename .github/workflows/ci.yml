# 每个 PR 的自动检查（agents 规则 C54），按"精简 CI"写（C74，模板 agents/模板/ci.yml）。
#   - 每次都跑：索引检查（C53）、类型检查、单元测试、插件侧边栏的浏览器级测试（C141）。项目小，不按路径跳过。
#   - 推送到 staging → 部署测试版 quickcome-copilot-staging；推送到 main → 部署正式版 quickcome-copilot（K-4：名字沿用）。
#   - 同一分支连续推送时取消旧的运行；缓存依赖和浏览器；每个 job 都有 timeout-minutes；不开定时任务。
# 分支保护只把汇总 job "ci-ok" 设为"必须通过"。
# CI 不需要任何密钥：Gemini、Workers AI 用替身，D1 用 Miniflare 的本地 SQLite。只有 deploy job 用 CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID，没填时打印"跳过"。
name: ci
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 项目地图和项目索引（C53）
        run: node scripts/check-project-index.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: 单元测试（中转服务、程序检查、读取适配器）
        run: npm test
      - name: 浏览器缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: 插件侧边栏（替身 chrome API；设置、存满就停、暂停和继续、切分页；agents C141）
        run: node scripts/e2e-ext.mjs

  # 汇总：分支保护只把这一项设为"必须通过"
  ci-ok:
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 汇总结果
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "有检查失败或被取消"; exit 1
          fi

  # 部署：只在推送到 staging（测试版）、main（正式版），并且 ci-ok 通过时。
  # 没填 GitHub Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 时 deploy.sh 打印"跳过"并成功（C103）。
  deploy:
    needs: [ci-ok]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main') && needs.ci-ok.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 部署（staging → quickcome-copilot-staging；main → quickcome-copilot）
        env:
          TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
        run: bash scripts/deploy.sh "$TARGET"
